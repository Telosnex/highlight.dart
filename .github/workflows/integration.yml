name: Integration

on:
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [master, 'ci/**']
  schedule:
    - cron: '11 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The package's tests in the test runner of each desktop platform. The
  # jobs share the steps of the first (YAML anchor).
  desktop-macos-arm64:
    name: macOS ARM64
    runs-on: macos-26
    timeout-minutes: 30
    steps: &desktop_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - run: dart pub get && dart test -r expanded
        working-directory: highlight
      - run: flutter pub get && flutter test -r expanded
        working-directory: flutter_highlight

  desktop-windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps: *desktop_steps

  # The same tests compiled for Chrome. The jobs share the steps of the
  # first (YAML anchor).
  web-linux-chrome-dart2js:
    name: Web Linux x64 Chrome dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WASM: ''
    steps: &web_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      # dart test skips the VM-only files (@TestOn('vm'): fixtures read with
      # dart:io).
      - run: |
          dart pub get
          dart test -p chrome ${WASM:+-c dart2wasm} -r expanded
        working-directory: highlight
      - run: |
          flutter pub get
          flutter test --platform chrome $WASM -r expanded
        working-directory: flutter_highlight

  web-linux-chrome-dart2wasm:
    name: Web Linux x64 Chrome dart2wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WASM: --wasm
    steps: *web_steps
