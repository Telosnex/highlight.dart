name: Unit

on:
  pull_request:
    branches: [master]
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [master, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # vendor/: the highlight.js fixtures.
          submodules: true
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - uses: Telosnex/telosnex_ci_tools/actions/lint@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: dart pub get
        working-directory: highlight
      - run: flutter pub get
        working-directory: flutter_highlight
      - run: flutter pub get
        working-directory: flutter_highlight/example
      # After pub get: dart format reads each package's language version.
      # Generated files (first line "// GENERATED ...") keep their generator's
      # layout; vendor/ is upstream's.
      - run: |
          git ls-files '*.dart' | grep -v '^vendor/' |
            while read -r f; do head -1 "$f" | grep -qiE '^// *generated' || echo "$f"; done |
            xargs dart format --output=none --set-exit-if-changed
      - run: dart analyze --fatal-infos
        working-directory: highlight
      - run: dart test -r expanded
        working-directory: highlight
      - run: flutter analyze --fatal-infos
        working-directory: flutter_highlight
      - run: flutter test -r expanded
        working-directory: flutter_highlight
